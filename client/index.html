          // Initialize timer on first move
          if (!this.reviewTimerStarted) {
            this.initializeReviewTimer();
            this.reviewTimerStarted = true;
          }

          // Get timestamps from the review object
          const reviewState = window.GameEngine?.getReviewState();
          if (!reviewState || !reviewState.timestamps) {
            return;
          }

          const moveNumber = moves.length;
          const currentTime = reviewState.timestamps[moveNumber];

          if (!currentTime) {
            return;
          }

          // Calculate time used for this move
          let timeUsed = 0;
          if (moveNumber > 1) {
            const previousTime = reviewState.timestamps[moveNumber - 1];
            if (previousTime) {
              timeUsed = Math.max(0, currentTime - previousTime);
            }
          }

          // Determine which player made this move
          const player = (moveNumber % 2 === 1) ? "black" : "white";

          // Subtract time used from player's remaining time
          if (player === "black") {
            this.reviewBlackRemainingTime -= timeUsed;
          } else {
            this.reviewWhiteRemainingTime -= timeUsed;
          }

          // Apply time control specific rules when move is played
          if (this.reviewTimeControlInfo) {
            const incrementMs = this.reviewTimeControlInfo.increment * 1000;
            const periodTimeMs = this.reviewTimeControlInfo.periodTime * 1000;

            if (this.reviewTimeControlInfo.type === "fis") {
              // Fischer: Add increment (even if time was at zero - forgiving for reviews)
              if (player === "black") {
                this.reviewBlackRemainingTime =
                  Math.max(0, this.reviewBlackRemainingTime) + incrementMs;
              } else {
                this.reviewWhiteRemainingTime =
                  Math.max(0, this.reviewWhiteRemainingTime) + incrementMs;
              }
            } else if (this.reviewTimeControlInfo.type === "byo") {
              // Byo-yomi: Use a period when main time expires, give back one period
              if (player === "black") {
                if (
                  this.reviewBlackRemainingTime <= 0 &&
                  this.reviewBlackPeriodsRemaining > 0
                ) {
                  this.reviewBlackRemainingTime = periodTimeMs; // Reset to full period time
                  this.reviewBlackPeriodsRemaining--; // Use one period
                }
              } else {
                if (
                  this.reviewWhiteRemainingTime <= 0 &&
                  this.reviewWhitePeriodsRemaining > 0
                ) {
                  this.reviewWhiteRemainingTime = periodTimeMs; // Reset to full period time
                  this.reviewWhitePeriodsRemaining--; // Use one period
                }
              }
            } else if (this.reviewTimeControlInfo.type === "can") {
              // Canadian: Track stones, add 10s safety net, reset when stones exhausted
              if (player === "black") {
                if (this.reviewBlackRemainingTime <= 0) {
                  if (this.reviewBlackStonesRemaining > 0) {
                    // Add 10s safety net and decrease stone counter
                    this.reviewBlackRemainingTime = 10000; // 10 second safety net
                    this.reviewBlackStonesRemaining--;
                  } else {
                    // Reset Canadian period - new stones and full time
                    this.reviewBlackRemainingTime = periodTimeMs;
                    this.reviewBlackStonesRemaining =
                      this.reviewTimeControlInfo.periodCount - 1; // -1 for current move
                  }
                } else {
                  // Normal move - just decrease stone counter if in Canadian period
                  if (
                    this.reviewBlackRemainingTime <
                      this.reviewTimeControlInfo.mainTime * 1000
                  ) {
                    this.reviewBlackStonesRemaining--;
                  }
                }
              } else {
                if (this.reviewWhiteRemainingTime <= 0) {
                  if (this.reviewWhiteStonesRemaining > 0) {
                    // Add 10s safety net and decrease stone counter
                    this.reviewWhiteRemainingTime = 10000; // 10 second safety net
                    this.reviewWhiteStonesRemaining--;
                  } else {
                    // Reset Canadian period - new stones and full time
                    this.reviewWhiteRemainingTime = periodTimeMs;
                    this.reviewWhiteStonesRemaining =
                      this.reviewTimeControlInfo.periodCount - 1; // -1 for current move
                  }
                } else {
                  // Normal move - just decrease stone counter if in Canadian period
                  if (
                    this.reviewWhiteRemainingTime <
                      this.reviewTimeControlInfo.mainTime * 1000
                  ) {
                    this.reviewWhiteStonesRemaining--;
                  }
                }
              }
            }
          }

          // Update current player (who is to move next)
          this.reviewCurrentPlayer = (player === "black") ? "white" : "black";

          // Set the timestamp for when this move was received (for live countdown)
          this.reviewLastMoveTime = Date.now();

          // Start/restart the countdown timer
          this.startReviewCountdown();
        }

        initializeReviewTimer() {
          // Parse time control parameters
          const mainTimeSeconds = this.parseMainTime(this.reviewMainTime);
          const periodInfo = this.parsePeriod(this.reviewPeriod);
          const incrementSeconds = this.parseIncrement(this.reviewIncrement);

          // Store time control info for display
          this.reviewTimeControlInfo = {
            mainTime: mainTimeSeconds,
            periodTime: periodInfo.time,
            periodCount: periodInfo.count,
            increment: incrementSeconds,
            type: this.reviewTimeControl,
          };

          // Calculate time already used from review history
          const reviewState = window.GameEngine?.getReviewState();
          if (
            reviewState && reviewState.reviewEntries &&
            reviewState.moves.length > 0
          ) {
            const timeCalculation = this.calculateAccumulatedTime(
              reviewState.reviewEntries,
              reviewState.moves.length,
            );
            const mainTimeMs = mainTimeSeconds * 1000;

            // Start with main time, subtract time already used
            this.reviewBlackRemainingTime = mainTimeMs -
              timeCalculation.blackTime;
            this.reviewWhiteRemainingTime = mainTimeMs -
              timeCalculation.whiteTime;
            this.reviewCurrentPlayer = timeCalculation.currentPlayer;
            this.reviewLastMoveTime = Date.now(); // Use current time for countdown

            // Initialize periods/stones for time controls
            this.reviewBlackPeriodsRemaining = periodInfo.count;
            this.reviewWhitePeriodsRemaining = periodInfo.count;
            this.reviewBlackStonesRemaining = periodInfo.count;
            this.reviewWhiteStonesRemaining = periodInfo.count;

            logger.log(
              `[UI] Estimated time settings after ${reviewState.moves.length} moves - Black: ${
                Math.floor(this.reviewBlackRemainingTime / 1000)
              }s, White: ${Math.floor(this.reviewWhiteRemainingTime / 1000)}s`,
            );
          } else {
            // Initialize for new game
            const mainTimeMs = mainTimeSeconds * 1000;
            this.reviewBlackRemainingTime = mainTimeMs;
            this.reviewWhiteRemainingTime = mainTimeMs;
            this.reviewCurrentPlayer = "black";
            this.reviewLastMoveTime = null;

            // Initialize periods/stones for new game
            this.reviewBlackPeriodsRemaining = periodInfo.count;
            this.reviewWhitePeriodsRemaining = periodInfo.count;
            this.reviewBlackStonesRemaining = periodInfo.count;
            this.reviewWhiteStonesRemaining = periodInfo.count;

            logger.log(
              `[UI] Estimated time settings - Both players start with ${
                Math.floor(mainTimeMs / 1000)
              }s`,
            );
          }

          this.reviewCountdownInterval = null;
        }

        calculateAccumulatedTime(reviewEntries, currentMoveCount) {
          const incrementMs = this.reviewTimeControlInfo.increment * 1000;
          const isFischer = this.reviewTimeControlInfo.type === "fis";

          let blackTimeUsed = 0;
          let whiteTimeUsed = 0;
          let lastTimestamp = null;

          // Process each move to calculate time used
          for (let i = 1; i < reviewEntries.length; i++) {
            const entry = reviewEntries[i];
            if (!entry.m || !entry.ts) continue;

            const moves = this.parseReviewMovesFromString(entry.m);
            const moveNumber = moves.length;

            if (moveNumber > currentMoveCount) break;

            const currentTimestamp = entry.ts;

            if (lastTimestamp) {
              const timeUsed = Math.max(0, currentTimestamp - lastTimestamp);
              const player = (moveNumber % 2 === 1) ? "black" : "white";

              if (player === "black") {
                blackTimeUsed += timeUsed;
                // Add Fischer increment for each move
                if (isFischer) {
                  blackTimeUsed = Math.max(0, blackTimeUsed - incrementMs);
                }
              } else {
                whiteTimeUsed += timeUsed;
                // Add Fischer increment for each move
                if (isFischer) {
                  whiteTimeUsed = Math.max(0, whiteTimeUsed - incrementMs);
                }
              }
            }

            lastTimestamp = currentTimestamp;
          }

          // Determine current player
          const currentPlayer = (currentMoveCount % 2 === 0)
            ? "black"
            : "white";

          return {
            blackTime: blackTimeUsed,
            whiteTime: whiteTimeUsed,
            currentPlayer: currentPlayer,
            lastMoveTime: lastTimestamp,
          };
        }

        parseReviewMovesFromString(moveString) {
          // Simple helper to parse move count from string (reuse existing logic)
          if (!moveString || moveString.trim() === "") {
            return [];
          }

          const coordinates = "abcdefghijklmnopqrs";
          const moves = [];
          let i = 0;
          let moveNumber = 1;

          while (i < moveString.length) {
            let move = null;

            if (i + 1 < moveString.length) {
              const twoChar = moveString.substring(i, i + 2);

              if (twoChar === "..") {
                move = { moveNumber: moveNumber };
                i += 2;
              } else if (twoChar === "!1" || twoChar === "!2") {
                if (i + 3 < moveString.length) {
                  move = { moveNumber: moveNumber };
                  i += 4;
                } else {
                  i += 2;
                }
              } else {
                const x_num = coordinates.indexOf(twoChar[0]);
                const y_num = coordinates.indexOf(twoChar[1]);

                if (x_num !== -1 && y_num !== -1) {
                  move = { moveNumber: moveNumber };
                }
                i += 2;
              }
            } else {
              i++;
            }

            if (move) {
              moves.push(move);
              moveNumber++;
            }
          }

          return moves;
        }

        startReviewCountdown() {
          // Clear existing countdown
          if (this.reviewCountdownInterval) {
            clearInterval(this.reviewCountdownInterval);
          }

          // Start new countdown that updates every second
          this.reviewCountdownInterval = setInterval(() => {
            this.updateReviewClockDisplay();
          }, 1000);

          // Update display immediately
          this.updateReviewClockDisplay();
        }

        stopReviewCountdown() {
          if (this.reviewCountdownInterval) {
            clearInterval(this.reviewCountdownInterval);
            this.reviewCountdownInterval = null;
            logger.log("[UI] Review countdown stopped");
          }
        }

        updateReviewClockDisplay() {
          if (!this.isReviewMode) {
            return;
          }

          const mainTimeMs = this.reviewTimeControlInfo.mainTime * 1000;
          const periodTimeMs = this.reviewTimeControlInfo.periodTime * 1000;
          const periodCount = this.reviewTimeControlInfo.periodCount;
          const incrementMs = this.reviewTimeControlInfo.increment * 1000;
          const isFischer = this.reviewTimeControlInfo.type === "fis";

          let blackRemainingTime = this.reviewBlackRemainingTime;
          let whiteRemainingTime = this.reviewWhiteRemainingTime;

          // Subtract live countdown time for current player (but never go below zero)
          if (this.reviewLastMoveTime) {
            const currentTime = Date.now();
            const timeSinceLastMove = currentTime - this.reviewLastMoveTime;

            if (this.reviewCurrentPlayer === "black") {
              blackRemainingTime = Math.max(
                0,
                blackRemainingTime - timeSinceLastMove,
              );
            } else {
              whiteRemainingTime = Math.max(
                0,
                whiteRemainingTime - timeSinceLastMove,
              );
            }
          }

          // Calculate display time for each player based on time control type
          const blackDisplayTime = this.calculateDisplayTime(
            blackRemainingTime,
            mainTimeMs,
            periodTimeMs,
            periodCount,
            isFischer,
            this.reviewBlackPeriodsRemaining,
            this.reviewBlackStonesRemaining,
          );
          const whiteDisplayTime = this.calculateDisplayTime(
            whiteRemainingTime,
            mainTimeMs,
            periodTimeMs,
            periodCount,
            isFischer,
            this.reviewWhitePeriodsRemaining,
            this.reviewWhiteStonesRemaining,
          );

          // Update clock displays
          this.blackClock.textContent = blackDisplayTime.display;
          this.whiteClock.textContent = whiteDisplayTime.display;

          // Highlight current player
          this.updateTurnIndicator(this.reviewCurrentPlayer);
        }

        calculateDisplayTime(
          remainingTime,
          mainTimeMs,
          periodTimeMs,
          periodCount,
          isFischer,
          periodsRemaining,
          stonesRemaining,
        ) {
          // For review mode: Never show negative time, stop at zero
          const remaining = Math.max(0, remainingTime);

          if (isFischer) {
            // Fischer: Show remaining time, stops at zero
            return {
              display: this.formatReviewTime(remaining),
              inPeriods: false,
            };
          } else if (remaining > 0) {
            // Still have time remaining
            if (remaining >= mainTimeMs) {
              // In main time
              return {
                display: this.formatReviewTime(remaining),
                inPeriods: false,
              };
            } else {
              // In period time - show periods/stones remaining
              if (this.reviewTimeControlInfo?.type === "byo") {
                return {
                  display: `${
                    this.formatReviewTime(remaining)
                  } (${periodsRemaining})`,
                  inPeriods: true,
                };
              } else if (this.reviewTimeControlInfo?.type === "can") {
                return {
                  display: `${
                    this.formatReviewTime(remaining)
                  } [${stonesRemaining}]`,
                  inPeriods: true,
                };
              } else {
                return {
                  display: this.formatReviewTime(remaining),
                  inPeriods: false,
                };
              }
            }
          } else {
            // Time expired
            if (this.reviewTimeControlInfo?.type === "byo") {
              // Byo-yomi: Show periods remaining
              if (periodsRemaining > 0) {
                return {
                  display: `${
                    this.formatReviewTime(periodTimeMs)
                  } (${periodsRemaining})`,
                  inPeriods: true,
                };
              } else {
                return {
                  display: "00:00",
                  inPeriods: false,
                };
              }
            } else if (this.reviewTimeControlInfo?.type === "can") {
              // Canadian: Show stones remaining
              if (stonesRemaining > 0) {
                return {
                  display: `00:10 [${stonesRemaining}]`, // 10s safety net
                  inPeriods: true,
                };
              } else {
                return {
                  display: `${
                    this.formatReviewTime(periodTimeMs)
                  } [${this.reviewTimeControlInfo.periodCount}]`,
                  inPeriods: true,
                };
              }
            } else {
              // No periods available - stay at zero
              return {
                display: "00:00",
                inPeriods: false,
              };
            }
          }
        }

        formatReviewTime(timeMs) {
          const totalSeconds = Math.floor(timeMs / 1000);
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;

          return `${minutes}:${seconds.toString().padStart(2, "0")}`;
        }

        updateReviewClockVisibility() {
          logger.log(
            "[UI] updateReviewClockVisibility called - isReviewMode:",
            this.isReviewMode,
            "reviewTimeControl:",
            this.reviewTimeControl,
          );
          if (this.isReviewMode) {
            // In review mode, only show clocks when the new review-clock params are complete.
            const hasAllParams = this.reviewClockEnabled && this.reviewTimeControl &&
              this.reviewMainTime &&
              (this.reviewPeriod || this.reviewIncrement);

            if (hasAllParams) {
              this.blackClock.style.display = "block";
              this.whiteClock.style.display = "block";
              logger.log("[UI] Review clocks shown - all params present");
            } else {
              this.blackClock.style.display = "none";
              this.whiteClock.style.display = "none";
              logger.log("[UI] Review clocks hidden - missing params:", {
                rc: this.reviewClockEnabled,
                rctc: this.reviewTimeControl,
                rcmt: this.reviewMainTime,
                rcpd: this.reviewPeriod,
                rcin: this.reviewIncrement,
              });
              // Stop countdown if incomplete time control
              this.stopReviewCountdown();
            }
          } else {
            // Show clocks normally for live games
            this.blackClock.style.display = "block";
            this.whiteClock.style.display = "block";
            logger.log("[UI] Live game clocks shown");
            // Stop review countdown when switching to live game
            this.stopReviewCountdown();
          }
        }

        updateUI(gameState) {
          this.currentKomi = Number.isFinite(Number(gameState.komi))
            ? Number(gameState.komi)
            : 7.5;

          // Update player names
          if (gameState.players) {
            this.blackName.textContent = gameState.players.black.name;
            this.whiteName.textContent = gameState.players.white.name;
          }

          // DON'T update board here - it will be handled by explicit updateBoard calls with proper board state

          // Update score (placeholder)
          this.updateScore(gameState);

          // Update game status and turn indicator
          this.updateGameStatus(gameState);

          // Ensure turn indicator is updated even if game status doesn't change
          this.updateTurnIndicator(gameState.currentPlayer);

          // Handle review mode clock display
          this.updateReviewClockVisibility();
        }

        updateClock(clockData) {
          // Only update live game clocks if not in review mode
          if (!this.isReviewMode) {
            if (clockData && clockData.black) {
              this.blackClock.textContent = this.formatTime(clockData.black);
            }
            if (clockData && clockData.white) {
              this.whiteClock.textContent = this.formatTime(clockData.white);
            }
          }
        }

        updateBoard(moves, boardState = null) {
          this.currentBoardState = boardState;
          logger.log(
            "[UI] updateBoard called with boardState:",
            boardState ? "YES" : "NO",
          );
          logger.log("[UI] Moves length:", moves ? moves.length : 0);

          // Update review timer if in review mode
          if (this.isReviewMode && moves && moves.length > 0) {
            this.updateReviewTimer(moves);
          }

          // Clear existing stones FIRST
          this.boardRenderer.clearAllStones();

          if (boardState) {
            logger.log(
              "[UI] ONLY using board state - ignoring move history to preserve captures",
            );
            let stonesPlaced = 0;
            // Use ONLY the board state (includes captures)
            for (let x = 0; x < 19; x++) {
              for (let y = 0; y < 19; y++) {
                const stoneValue = boardState[x][y];
                if (stoneValue !== 0) {
                  const stone = this.boardRenderer.getStoneElement(x, y);
                  if (stone) {
                    const stoneImageSrc = stoneValue === 1
                      ? CONFIG.IMAGES.BLACK_STONE
                      : CONFIG.IMAGES.WHITE_STONE;
                    stone.setAttributeNS(
                      "http://www.w3.org/1999/xlink",
                      "href",
                      stoneImageSrc,
                    );
                    stonesPlaced++;
                  } else {
                    logger.warn(
                      `[UI] No stone element found for position ${x},${y}`,
                    );
                  }
                }
              }
            }
            logger.log(`[UI] Placed ${stonesPlaced} stones using board state`);

            // Mark current move ONLY if we have moves and coordinates
            if (moves && moves.length > 0) {
              const lastMove = moves[moves.length - 1];
              if (lastMove.coordinates) {
                this.markCurrentMove(
                  lastMove.coordinates,
                  lastMove.move,
                  lastMove.color,
                );
              }
            }
          } else {
            logger.log(
              "[UI] Using move history to render stones (no board state available)",
            );
            // Fallback to move history only when no board state
            if (moves) {
              moves.forEach((move, index) => {
                if (move.coordinates) {
                  const [col, row] = move.coordinates;
                  const stone = this.boardRenderer.getStoneElement(col, row);
                  if (stone) {
                    const stoneImageSrc = move.color === "black"
                      ? CONFIG.IMAGES.BLACK_STONE
                      : CONFIG.IMAGES.WHITE_STONE;
                    stone.setAttributeNS(
                      "http://www.w3.org/1999/xlink",
                      "href",
                      stoneImageSrc,
                    );
                  }
                }
              });

              // Mark current move
              if (moves.length > 0) {
                const lastMove = moves[moves.length - 1];
                if (lastMove.coordinates) {
                  this.markCurrentMove(
                    lastMove.coordinates,
                    lastMove.move,
                    lastMove.color,
                  );
                }
              }
            }
          }
        }

        markCurrentMove(coordinates, moveNotation = null, moveColor = null) {
          // Store coordinates and move notation for analysis updates
          this.lastMoveCoordinates = coordinates;
          this.lastMoveNotation = moveNotation;
          if (moveColor) this.lastMoveColor = moveColor;

          // Remove existing move marker
          const oldMarker = document.getElementById(
            CONFIG.ELEMENT_IDS.CURRENT_MOVE_MARKER,
          );
          if (oldMarker) {
            oldMarker.remove();
          }

          const [col, row] = coordinates;
          const stone = this.boardRenderer.getStoneElement(col, row);
          if (!stone) return;

          const svgContainer = stone.parentNode;

          // Determine what color stone was played
          const stoneImg = stone.getAttributeNS(
            "http://www.w3.org/1999/xlink",
            "href",
          );
          const isBlackStone = stoneImg === CONFIG.IMAGES.BLACK_STONE;
          const strokeColor = isBlackStone ? "#FFFFFF" : "#000000"; // White stroke for black stone, black stroke for white stone

          // Determine color based on analysis result or default to green
          let color = "#1D9500"; // Default to green
          let isAiTopMove = false;

          // Check if this move matches the previous best move (blue move)
          if (this.previousBestMove && this.lastMoveNotation) {
            const playedMove = this.lastMoveNotation.toUpperCase();
            const bestMove = this.previousBestMove.toUpperCase();
            if (playedMove === bestMove) {
              color = "#4CB2E5"; // Blue for best move
              isAiTopMove = true;
              logger.log(
                "[UI] BLUE MOVE! Played:",
                playedMove,
                "matched best move:",
                bestMove,
              );
            } else {
              // Calculate normal move quality
              if (this.currentMoveAnalysis && this.previousMoveAnalysis) {
                const currentAnalysis = this.currentMoveAnalysis.analysis;
                const previousAnalysis = this.previousMoveAnalysis.analysis;

                if (
                  currentAnalysis && previousAnalysis &&
                  currentAnalysis.rootInfo && previousAnalysis.rootInfo
                ) {
                  // Calculate score loss: difference between previous position and current position
                  const previousWinrate = previousAnalysis.rootInfo.winrate ||
                    0;
                  const currentWinrate = currentAnalysis.rootInfo.winrate || 0;
                  const scoreLoss = Math.abs(previousWinrate - currentWinrate) *
                    100; // Convert to percentage points
                  color = getMoveQualityColor(scoreLoss);
                  logger.log(
                    "[UI] Move quality - Previous WR:",
                    previousWinrate,
                    "Current WR:",
                    currentWinrate,
                    "Loss:",
                    scoreLoss,
                    "Color:",
                    color,
                  );
                }
              }
            }
          } else if (this.currentMoveAnalysis && this.previousMoveAnalysis) {
            const currentAnalysis = this.currentMoveAnalysis.analysis;
            const previousAnalysis = this.previousMoveAnalysis.analysis;

            if (
              currentAnalysis && previousAnalysis && currentAnalysis.rootInfo &&
              previousAnalysis.rootInfo
            ) {
              // Calculate score loss: difference between previous position and current position
              const previousWinrate = previousAnalysis.rootInfo.winrate || 0;
              const currentWinrate = currentAnalysis.rootInfo.winrate || 0;
              const scoreLoss = Math.abs(previousWinrate - currentWinrate) *
                100; // Convert to percentage points
              color = getMoveQualityColor(scoreLoss);
              logger.log(
                "[UI] Move quality - Previous WR:",
                previousWinrate,
                "Current WR:",
                currentWinrate,
                "Loss:",
                scoreLoss,
                "Color:",
                color,
              );
            }
          } else if (!this.previousMoveAnalysis) {
            // Default to good move if no previous analysis
            color = "#CECE00"; // Good move quality (yellow)
            logger.log(
              "[UI] Move quality - No previous analysis, defaulting to good",
            );
          }

          // Store the move quality color and update pie center
          this.currentMoveQualityColor = color;
          this.updatePieCenter();

          const radius = parseFloat(stone.getAttribute("width")) / 2;
          const cx = parseFloat(stone.getAttribute("x")) + radius;
          const cy = parseFloat(stone.getAttribute("y")) + radius;
          const effectKey = `${coordinates[0]},${coordinates[1]},${moveNotation ?? ""}`;

          // Create a colored stone overlay to show move quality.
          const circle = document.createElementNS(CONFIG.SVG_NS, "circle");
          circle.setAttributeNS(null, "cx", cx);
          circle.setAttributeNS(null, "cy", cy);
          circle.setAttributeNS(null, "r", radius * 0.525); // 75% of previous size
          circle.setAttributeNS(null, "stroke-width", "2");
          circle.setAttributeNS(null, "fill", color);
          circle.setAttributeNS(null, "stroke", strokeColor);
          circle.style.fill = color; // Force the fill color via style
          circle.setAttributeNS(
            null,
            "id",
            CONFIG.ELEMENT_IDS.CURRENT_MOVE_MARKER,
          );
          circle.setAttributeNS(null, "class", "current-move-marker");

          svgContainer.appendChild(circle);

          if (isAiTopMove && this.shouldShowMoveEffect() && this.lastEffectKey !== effectKey) {
            this.lastEffectKey = effectKey;
            this.showMoveRingEffect(svgContainer, cx, cy, radius);
          }
        }

        showMoveRingEffect(svgContainer, cx, cy, radius) {
          document.getElementById("move-ring-effect")?.remove();
          const group = document.createElementNS(CONFIG.SVG_NS, "g");
          group.setAttributeNS(null, "id", "move-ring-effect");
          group.style.pointerEvents = "none";

          const duration = 2000;
          const interval = 650;
          const strokeStart = 2;
          const rings = [];
          for (let i = 0; i < 3; i++) {
            const ring = document.createElementNS(CONFIG.SVG_NS, "circle");
            ring.setAttributeNS(null, "cx", cx);
            ring.setAttributeNS(null, "cy", cy);
            ring.setAttributeNS(null, "r", radius + strokeStart);
            ring.setAttributeNS(null, "fill", "none");
            ring.setAttributeNS(null, "fill-opacity", "0");
            ring.setAttributeNS(null, "stroke", "#006DFF");
            ring.setAttributeNS(null, "stroke-width", strokeStart);
            ring.setAttributeNS(null, "opacity", "0");
            ring.style.filter = "drop-shadow(0 0 4px rgba(0,109,255,0.75)) drop-shadow(0 0 8px rgba(0,109,255,0.35))";
            group.appendChild(ring);
            rings.push({ ring, delay: i * interval });
          }

          // SVG uses paint order, not CSS z-index. Re-append the effect as the
          // final child every time so it is painted above stones and markers.
          svgContainer.appendChild(group);

          const start = performance.now();
          const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
          const animate = (now) => {
            let active = false;
            for (const item of rings) {
              const elapsed = now - start - item.delay;
              const progress = Math.max(0, Math.min(1, elapsed / duration));
              if (elapsed < duration) active = true;
              if (elapsed < 0) continue;

              const eased = easeOutCubic(progress);
              // Radius is outside the stone; stroke never covers the stone.
              const startRadius = radius + strokeStart;
              const currentRadius = startRadius + radius * 0.5 * eased;
              const opacity = progress < 0.18
                ? progress / 0.18
                : Math.max(0, 1 - (progress - 0.18) / 0.82);
              const strokeWidth = strokeStart;

              item.ring.setAttributeNS(null, "r", currentRadius);
              item.ring.setAttributeNS(null, "opacity", opacity);
              item.ring.setAttributeNS(null, "stroke-width", strokeWidth);
            }

            if (active) requestAnimationFrame(animate);
            else group.remove();
          };
          requestAnimationFrame(animate);
        }

        showMoveShapePill(text) {
          if (!text || !this.lastMoveCoordinates || this.pillMode === "off") return;
          const [col, row] = this.lastMoveCoordinates;
          const stone = this.boardRenderer.getStoneElement(col, row);
          if (!stone) return;
          const svgContainer = stone.parentNode?.parentNode || stone.parentNode;
          if (!svgContainer) return;

          document.getElementById("move-shape-pill")?.remove();

          const pill = document.createElement("div");
          pill.className = "move-shape-pill";
          pill.textContent = text;

          const measurer = document.createElement("div");
          measurer.style.position = "absolute";
          measurer.style.left = "-9999px";
          measurer.style.top = "-9999px";
          measurer.style.visibility = "hidden";
          measurer.appendChild(pill);
          document.body.appendChild(measurer);
          const width = Math.ceil(pill.getBoundingClientRect().width);
          const height = Math.ceil(pill.getBoundingClientRect().height);
          measurer.remove();

          const stoneX = parseFloat(stone.getAttribute("x"));
          const stoneY = parseFloat(stone.getAttribute("y"));
          const stoneSize = parseFloat(stone.getAttribute("width"));
          const margin = 4;
          const stoneLeft = stoneX;
          const stoneRight = stoneX + stoneSize;
          const stoneTop = stoneY;
          const stoneBottom = stoneY + stoneSize;
          const rightX = stoneRight;
          const leftX = stoneLeft - width;
          const topY = stoneTop - height;
          const bottomY = stoneBottom;
          const x = rightX + width > CONFIG.BOARD.VIEW_BOX_SIZE - margin
            ? Math.max(margin, leftX)
            : Math.max(margin, rightX);
          const y = topY < margin
            ? Math.min(CONFIG.BOARD.VIEW_BOX_SIZE - height - margin, bottomY + height / 2)
            : Math.min(CONFIG.BOARD.VIEW_BOX_SIZE - height - margin, topY + height / 2);

          const foreignObject = document.createElementNS(CONFIG.SVG_NS, "foreignObject");
          foreignObject.setAttributeNS(null, "id", "move-shape-pill");
          foreignObject.setAttributeNS(null, "x", x);
          foreignObject.setAttributeNS(null, "y", y);
          foreignObject.setAttributeNS(null, "width", width);
          foreignObject.setAttributeNS(null, "height", height);
          foreignObject.style.pointerEvents = "none";

          foreignObject.appendChild(pill);
          svgContainer.appendChild(foreignObject);
          setTimeout(() => foreignObject.remove(), 3000);
        }

        updateScore(gameState) {
          // Note: Confidence totals are displayed by scoreBarRenderer.updateScoreText()
          // Don't overwrite the confidence chart text with capture counts

          // Capture counts are available in gameState.captures if needed elsewhere
          const blackCaptures = gameState.captures
            ? gameState.captures.black
            : 0;
          const whiteCaptures = gameState.captures
            ? gameState.captures.white
            : 0;

          // TODO: Display captures elsewhere if needed (not in confidence chart)
        }

        updateWinrate(winratePercent) {
          const winningPercent = Math.max(0, Math.min(100, winratePercent));

          // BLACK = ALWAYS LEFT TO RIGHT (clockwise from top)
          // WHITE = ALWAYS RIGHT TO LEFT (counter-clockwise from top)
          // Use BLACK's actual winrate percentage for the pie chart

          let blackPercent = 50; // Default
          let isBlackWinning = true;

          if (
            this.currentMoveAnalysis && this.currentMoveAnalysis.analysis &&
            this.currentMoveAnalysis.analysis.rootInfo
          ) {
            const blackWinrate =
              this.currentMoveAnalysis.analysis.rootInfo.winrate;
            blackPercent = Math.max(0, Math.min(100, blackWinrate * 100));
            isBlackWinning = blackWinrate > 0.5;
          }

          // Store previous value for animation
          const previousBlackPercent = this.hasWinratePercent
            ? this.previousBlackPercent
            : blackPercent;
          const hasPreviousWinrate = this.hasWinratePercent;
          this.previousBlackPercent = blackPercent;
          this.hasWinratePercent = true;
          this.updateWinrateBar(
            blackPercent,
            previousBlackPercent,
            hasPreviousWinrate,
          );

          // If there's a significant change, animate the pie chart
          if (Math.abs(blackPercent - previousBlackPercent) > 0.1) {
            this.animatePieChart(previousBlackPercent, blackPercent);
          } else {
            // Direct update if change is too small
            this.pieChart.style.backgroundImage = this.getWinratePieGradient(
              blackPercent,
            );

            // Update text immediately for small changes
            this.pieText.textContent = `${Math.round(winningPercent)}%`;
          }
        }

        animatePieChart(fromPercent, toPercent) {
          // Animation duration in milliseconds
          const duration = 600;
          const startTime = performance.now();

          // Get the winning percentage for text animation
          const fromWinningPercent = Math.max(fromPercent, 100 - fromPercent);
          const toWinningPercent = Math.max(toPercent, 100 - toPercent);

          const animate = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);

            // Easing function for smooth animation
            const easeOutQuart = 1 - Math.pow(1 - progress, 4);

            // Calculate current percentage
            const currentPercent = fromPercent +
              (toPercent - fromPercent) * easeOutQuart;

            // Calculate current winning percentage for text
            const currentWinningPercent = fromWinningPercent +
              (toWinningPercent - fromWinningPercent) * easeOutQuart;

            // Update pie chart
            this.pieChart.style.backgroundImage = this.getWinratePieGradient(
              currentPercent,
            );

            // Update animated text
            this.pieText.textContent = `${Math.round(currentWinningPercent)}%`;

            // Continue animation if not complete
            if (progress < 1) {
              requestAnimationFrame(animate);
            }
          };

          requestAnimationFrame(animate);
        }

        getWinratePieGradient(blackPercent) {
          const split = 100 - blackPercent;
          return `conic-gradient(#f0f0f0 0% ${split}%, #111 ${split}% 100%)`;
        }

        updateWinrateBar(
          blackPercent,
          previousBlackPercent,
          hasPreviousWinrate,
        ) {
          if (this.winrateBarBlack) {
            this.winrateBarBlack.style.width = `${blackPercent}%`;
          }
          const whitePercent = 100 - blackPercent;
          if (this.winrateBarWhite) {
            this.winrateBarWhite.style.width = `${whitePercent}%`;
          }
          if (this.winrateBarBlackLabel) {
            this.winrateBarBlackLabel.textContent = `${
              Math.round(blackPercent)
            }%`;
          }
          if (this.winrateBarWhiteLabel) {
            this.winrateBarWhiteLabel.textContent = `${
              Math.round(whitePercent)
            }%`;
          }
          this.updateWinrateBarArrow(
            blackPercent,
            previousBlackPercent,
            hasPreviousWinrate,
          );
        }

        updateWinrateBarArrow(
          blackPercent,
          previousBlackPercent,
          hasPreviousWinrate,
        ) {
          if (!this.winrateBarArrow) return;
          const delta = blackPercent - previousBlackPercent;
          if (!hasPreviousWinrate || Math.abs(delta) < 0.05) {
            this.clearWinrateBarArrow();
            return;
          }

          const barWidth = this.winrateBarArrow.parentElement?.clientWidth ||
            524;
          const previousPx = (previousBlackPercent / 100) * barWidth;
          const currentPx = (blackPercent / 100) * barWidth;
          const changePx = Math.abs(currentPx - previousPx);
          const headWidth = 19;
          const halfBodyWidth = 10;
          let arrowWidth = Math.max(headWidth + halfBodyWidth, changePx);
          let leftPx = previousPx - arrowWidth;
          const pointsRight = delta > 0;

          if (pointsRight) {
            leftPx = previousPx;
            arrowWidth = Math.min(arrowWidth, barWidth - previousPx);
          } else {
            arrowWidth = Math.min(arrowWidth, previousPx);
            leftPx = previousPx - arrowWidth;
          }

          if (arrowWidth <= 0) {
            this.clearWinrateBarArrow();
            return;
          }

          const createPiece = (className) => {
            const piece = document.createElement("span");
            piece.className = className;
            return piece;
          };

          const head = createPiece(
            pointsRight ? "wr-arrow-head points-right" : "wr-arrow-head",
          );
          const body = createPiece("wr-arrow-body");
          this.winrateBarArrow.replaceChildren(
            ...(pointsRight ? [body, head] : [head, body]),
          );
          this.winrateBarArrow.style.left = `${leftPx}px`;
          this.winrateBarArrow.style.width = `${arrowWidth}px`;
          this.winrateBarArrow.classList.add("visible");
        }

        clearWinrateBarArrow() {
          if (!this.winrateBarArrow) return;
          this.winrateBarArrow.replaceChildren();
          this.winrateBarArrow.style.width = "0px";
          this.winrateBarArrow.classList.remove("visible");
        }

        updatePieCenter() {
          // This center color is the CURRENT PLAYED MOVE ERROR/QUALITY INDEX.
          // It is intentionally separate from:
          // - the black/white WR pie chart colors
          // - the backend move-quality counter/summary indicator
          if (this.pieCenter) {
            this.pieCenter.style.backgroundColor = this.currentMoveQualityColor;
          }
        }

        calculateMoveQuality() {
          // Calculate move quality color without placing a marker
          let color = "#1D9500"; // Default to green

          // Check if this move matches the previous best move (blue move)
          if (this.previousBestMove && this.lastMoveNotation) {
            const playedMove = this.lastMoveNotation.toUpperCase();
            const bestMove = this.previousBestMove.toUpperCase();
            if (playedMove === bestMove) {
              color = "#4CB2E5"; // Blue for best move
              logger.log(
                "[UI] BLUE MOVE! Played:",
                playedMove,
                "matched best move:",
                bestMove,
              );
            } else {
              // Calculate normal move quality
              if (this.currentMoveAnalysis && this.previousMoveAnalysis) {
                const currentAnalysis = this.currentMoveAnalysis.analysis;
                const previousAnalysis = this.previousMoveAnalysis.analysis;

                if (
                  currentAnalysis && previousAnalysis &&
                  currentAnalysis.rootInfo && previousAnalysis.rootInfo
                ) {
                  // Calculate score loss: difference between previous position and current position
                  const previousWinrate = previousAnalysis.rootInfo.winrate ||
                    0;
                  const currentWinrate = currentAnalysis.rootInfo.winrate || 0;
                  const scoreLoss = Math.abs(previousWinrate - currentWinrate) *
                    100; // Convert to percentage points
                  color = getMoveQualityColor(scoreLoss);
                  logger.log(
                    "[UI] Move quality - Previous WR:",
                    previousWinrate,
                    "Current WR:",
                    currentWinrate,
                    "Loss:",
                    scoreLoss,
                    "Color:",
                    color,
                  );
                }
              }
            }
          } else if (this.currentMoveAnalysis && this.previousMoveAnalysis) {
            const currentAnalysis = this.currentMoveAnalysis.analysis;
            const previousAnalysis = this.previousMoveAnalysis.analysis;

            if (
              currentAnalysis && previousAnalysis && currentAnalysis.rootInfo &&
              previousAnalysis.rootInfo
            ) {
              // Calculate score loss: difference between previous position and current position
              const previousWinrate = previousAnalysis.rootInfo.winrate || 0;
              const currentWinrate = currentAnalysis.rootInfo.winrate || 0;
              const scoreLoss = Math.abs(previousWinrate - currentWinrate) *
                100; // Convert to percentage points
              color = getMoveQualityColor(scoreLoss);
              logger.log(
                "[UI] Move quality - Previous WR:",
                previousWinrate,
                "Current WR:",
                currentWinrate,
                "Loss:",
                scoreLoss,
                "Color:",
                color,
              );
            }
          } else if (!this.previousMoveAnalysis) {
            // Default to good move if no previous analysis
            color = "#CECE00"; // Good move quality (yellow)
            logger.log(
              "[UI] Move quality - No previous analysis, defaulting to good",
            );
          }

          // Store the move quality color and update pie center
          this.currentMoveQualityColor = color;
          this.updatePieCenter();
        }

        updateGameStatus(gameState) {
          let status = "Connected";
          const hasResult = Boolean(this.parseResultWinner(gameState));
          if (gameState.phase === "finished" || gameState.finished || hasResult) {
            status = "Game Finished";
            this.gameFinished = true;
            this.showGameOverDisplay(gameState);
          } else {
            this.gameFinished = false;
            this.hideGameOverDisplay();
            if (gameState.currentPlayer) {
              status = `${
                gameState.currentPlayer.charAt(0).toUpperCase() +
                gameState.currentPlayer.slice(1)
              } to play`;
            }
          }
          this.gameStatus.textContent = status;

          // Update turn indicator stones
          this.updateTurnIndicator(gameState.currentPlayer);
        }

        showGameOverDisplay(gameState) {
          const parsedWinner = this.parseResultWinner(gameState);
          let winner = parsedWinner || "B+";

          if (!parsedWinner &&
            this.currentMoveAnalysis && this.currentMoveAnalysis.analysis &&
            this.currentMoveAnalysis.analysis.rootInfo
          ) {
            // Use winrate to determine likely winner as fallback
            const blackWinrate =
              this.currentMoveAnalysis.analysis.rootInfo.winrate;
            winner = blackWinrate > 0.5 ? "B+" : "W+";
            logger.log(
              "[UI] Using AI winrate to determine winner:",
              blackWinrate,
              "-> Winner:",
              winner,
            );
          }

          this.gameOverText.textContent = winner;
          const boardElement = this.gameOverOverlay?.closest(".goboard");
          const boardVisible = boardElement && getComputedStyle(boardElement).display !== "none";
          this.gameOverOverlay.style.display = boardVisible ? "flex" : "none";
          if (this.resultModalText) this.resultModalText.textContent = winner;
          if (this.resultModal) this.resultModal.style.display = boardVisible ? "none" : "flex";

          logger.log(
            "[UI] Game Over - Winner:",
            winner,
            "GameState:",
            gameState,
          );
        }

        parseResultWinner(gameState) {
          const values = [gameState.outcome, gameState.winner]
            .filter((value) => value !== undefined && value !== null)
            .map((value) => String(value).trim())
            .filter(Boolean);

          for (const raw of values) {
            const normalized = raw.toLowerCase();
            if (/\bw\s*\+/.test(normalized) || normalized === "w" || normalized.includes("white")) return "W+";
            if (/\bb\s*\+/.test(normalized) || normalized === "b" || normalized.includes("black")) return "B+";
          }

          const blackName = gameState.players?.black?.name;
          const whiteName = gameState.players?.white?.name;
          for (const raw of values) {
            const plusName = raw.split("+")[0]?.trim();
            if (!plusName) continue;
            if (this.looseNameMatch(plusName, whiteName)) return "W+";
            if (this.looseNameMatch(plusName, blackName)) return "B+";
          }

          return null;
        }

        looseNameMatch(value, playerName) {
          if (!value || !playerName) return false;
          const normalize = (text) => String(text).toLowerCase().replace(/[^a-z0-9]/g, "");
          const a = normalize(value);
          const b = normalize(playerName);
          if (!a || !b) return false;
          return a === b || a.includes(b) || b.includes(a);
        }

        hideGameOverDisplay() {
          this.gameOverOverlay.style.display = "none";
          if (this.resultModal) this.resultModal.style.display = "none";
        }

        updateTurnIndicator(currentPlayer) {
          // Reset both stones
          this.blackTurnStone.classList.remove("active");
          this.whiteTurnStone.classList.remove("active");

          if (currentPlayer === "black") {
            this.blackTurnStone.classList.add("active");
          } else if (currentPlayer === "white") {
            this.whiteTurnStone.classList.add("active");
          }
          // If no current player, both stones remain hidden
        }

        formatTime(timeData) {
          if (!timeData || typeof timeData !== "object") {
            return "00:00";
          }

          const totalSeconds = Math.floor(timeData.time / 1000);
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;

          // Show periods if in byo-yomi
          if (timeData.periods > 0 && timeData.time <= 0) {
            const periodTimeLeft = Math.floor(timeData.period_time_left / 1000);
            return `${periodTimeLeft} ${timeData.periods}`;
          }

          return `${minutes}:${seconds.toString().padStart(2, "0")}`;
        }

        updateAnalysis(analysisData) {
          // Finished games still receive backlog/final analysis updates.
          // Keep the game-over overlay, but update winrate, points, and MQI.
          logger.log("[UI] Analysis result received:", analysisData);
          if (analysisData.moveQuality) {
            this.moveQualityState = analysisData.moveQuality;
            this.updateMoveQualityIndex(this.moveQualityState);
            logger.log(
              "[UI] Backend move quality state:",
              this.moveQualityState,
            );
          }
          if (!analysisData.analysis) {
            return;
          }

          // Store previous analysis before updating current
          this.previousMoveAnalysis = this.currentMoveAnalysis;

          // Store the best move from PREVIOUS analysis for current move comparison
          if (
            this.previousMoveAnalysis && this.previousMoveAnalysis.analysis &&
            this.previousMoveAnalysis.analysis.moveInfos
          ) {
            const bestMove = this.previousMoveAnalysis.analysis.moveInfos[0];
            this.previousBestMove = bestMove ? bestMove.move : null;
            logger.log(
              "[UI] Previous AI recommendation was:",
              this.previousBestMove,
              "for the move that was just played",
            );
          } else {
            this.previousBestMove = null;
          }

          this.currentMoveAnalysis = analysisData;

          // Show current AI recommendation for next move
          if (
            analysisData.analysis && analysisData.analysis.moveInfos &&
            analysisData.analysis.moveInfos[0]
          ) {
            const nextBestMove = analysisData.analysis.moveInfos[0].move;
            logger.log(
              "[UI] AI top move recommendation for NEXT move:",
              nextBestMove,
            );
          }

          // Update winrate display - always show winning percentage
          if (analysisData.analysis && analysisData.analysis.rootInfo) {
            const blackWinrate = analysisData.analysis.rootInfo.winrate;
            const winningWinrate = blackWinrate > 0.5
              ? blackWinrate
              : (1 - blackWinrate);
            this.updateWinrate(winningWinrate * 100);
          }

          // Update ownership analysis if available
          if (analysisData.analysis && analysisData.analysis.ownership) {
            this.updateOwnershipAnalysis(analysisData.analysis);
          }

          // Update move indicator with quality color if we have the current move
          if (this.lastMoveCoordinates) {
            this.markCurrentMove(
              this.lastMoveCoordinates,
              this.lastMoveNotation,
              this.lastMoveColor,
            );
          } else {
            // Update pie center even if no move marker to show
            this.calculateMoveQuality();
          }
        }

        updateMoveQualityIndex(moveQualityState) {
          const summary = moveQualityState && moveQualityState.summary;
          if (!summary) return;

          const colors = ["blue", "green", "yellow", "red", "purple"];
          for (const player of ["black", "white"]) {
            const counts = summary[player] || {};

            for (const color of colors) {
              const element = this.moveQualityIndexElements?.[player]?.[color];
              if (!element) continue;
              const count = Number(counts[color]) || 0;
              element.textContent = String(count);
              element.title = `${player} ${color} move quality count: ${count}`;
            }
          }
        }

        updatePatternMatch(patternData) {
          const moveName = (patternData.moveName || "").trim();
          if (
            !this.shouldShowShapePills() || !moveName ||
            ["No pattern found", "Unknown", "undefined", "null"].includes(moveName)
          ) return;
          this.showMoveShapePill(moveName);
          logger.log(`[UIManager] Pattern pill shown: ${moveName}`);
        }

        updateOwnershipAnalysis(analysis) {
          const ownership = analysis.ownership;
          if (!ownership || ownership.length === 0) {
            logger.log("[UI] No ownership data received");
            return;
          }

          const result = this.scoreBarMode === "territory"
            ? this.buildTerritoryScoreResult(ownership)
            : this.buildAreaScoreResult(
              ownership,
              analysis.rootInfo?.scoreLead || 0,
            );

          // Update the confidence chart
          this.scoreBarRenderer.updateScoreBar(
            result.player_1.buckets,
            result.player_2.buckets,
            {
              blackPointsTotal: result.player_1.total,
              whitePointsTotal: result.player_2.total,
              blackInfluenceTotal: result.player_1.influenceTotal,
              whiteInfluenceTotal: result.player_2.influenceTotal,
              unclaimedTotal: result.unclaimedTotal,
              hideUnclaimed: this.scoreBarMode === "territory",
              scaleToActiveTotal: this.scoreBarMode === "territory",
              pointsOnlyGraph: false,
              hideCenterLine: this.scoreBarMode === "territory",
              graphTotal: result.graphTotal,
              onLargePointLoss: this.shouldShowPointPills()
                ? (loss) => this.showMoveShapePill(`${loss.toFixed(1)} pts`)
                : undefined,
            },
          );

          logger.log(
            `[UI] ${this.scoreBarMode} ownership analysis - Black:`,
            result.player_1.total,
            "White:",
            result.player_2.total,
          );
          logger.log(
            "[UI] Black confidence buckets:",
            result.player_1.buckets,
          );
          logger.log(
            "[UI] White confidence buckets:",
            result.player_2.buckets,
          );
        }

        initScoreBuckets() {
          return {
            total: 0,
            influenceTotal: undefined,
            buckets: Array(11).fill(0),
          };
        }

        createEmptyScoreResult() {
          return {
            player_1: this.initScoreBuckets(), // Black
            player_2: this.initScoreBuckets(), // White
          };
        }

        buildAreaScoreResult(ownership, scoreLead) {
          const result = this.createEmptyScoreResult();
          const komi = this.currentKomi ?? 7.5;
          result.player_2.total = komi;
          result.player_2.buckets[10] = komi;
          result.unclaimedTotal = 0;

          for (const val of ownership) {
            const absVal = Math.abs(val);
            const player = val >= 0 ? result.player_1 : result.player_2;

            // Keep area counting exactly as before: totals use ownership value.
            if (val >= 0) {
              result.player_1.total += val;
            } else {
              result.player_2.total += absVal;
            }

            // Visual-only thresholding, matching territory chart:
            // points | influence | unclaimed | influence | points.
            if (absVal >= 0.8) {
              player.buckets[10] += 1;
            } else if (absVal >= 0.4) {
              player.buckets[0] += 1;
            } else {
              result.unclaimedTotal += 1;
            }
          }

          result.player_1.total = +result.player_1.total.toFixed(3);
          result.player_2.total = +result.player_2.total.toFixed(3);
          this.adjustConfidenceForScoreLead(result, scoreLead);
          result.graphTotal = result.player_1.buckets.reduce((sum, value) => sum + value, 0) +
            result.player_2.buckets.reduce((sum, value) => sum + value, 0) +
            result.unclaimedTotal;
          return result;
        }

        buildTerritoryScoreResult(ownership) {
          const result = this.createEmptyScoreResult();
          const boardSize = Math.sqrt(ownership.length);
          const boardState = this.currentBoardState;
          const excludedOwnStones = { black: 0, white: 0 };

          // Territory scoring includes komi for White.
          const komi = this.currentKomi ?? 7.5;
          result.player_2.total = komi;
          result.player_2.buckets[10] = komi;

          const getStoneAt = (index) => {
            if (!boardState || !Number.isInteger(boardSize)) return 0;
            const x = index % boardSize;
            const y = Math.floor(index / boardSize);
            return boardState[x]?.[y] ?? 0;
          };

          // Territory mode uses a simplified graph: solid territory is drawn
          // as solid black/white, influence as the lighter black/darker white.
          // Scoring is territory-style:
          // - empty, strongly owned point: 1 point
          // - opponent stone on a strongly owned point: 1 territory point +
          //   exactly 1 extra prisoner/captured-stone point
          // - own living stones and weak ownership are not doubled
          for (let index = 0; index < ownership.length; index++) {
            const val = ownership[index];
            const absVal = Math.abs(val);
            const isBlackOwnership = val >= 0;
            const stone = getStoneAt(index);
            const ownStone = isBlackOwnership ? 1 : 2;
            const opponentStone = isBlackOwnership ? 2 : 1;
            const isOwnStone = stone === ownStone;
            const isCapturedStone = absVal >= 0.8 && stone === opponentStone;
            const player = isBlackOwnership ? result.player_1 : result.player_2;

            if (absVal < 0.4) {
              result.unclaimedTotal = (result.unclaimedTotal || 0) + 1;
              continue;
            }

            if (isOwnStone) {
              if (isBlackOwnership) excludedOwnStones.black++;
              else excludedOwnStones.white++;
              result.unclaimedTotal = (result.unclaimedTotal || 0) + 1;
              continue;
            }

            if (absVal >= 0.8) {
              const pointValue = 1 + (isCapturedStone ? 1 : 0);
              player.total += pointValue;
              player.buckets[10] += pointValue;
            } else {
              player.influenceTotal = (player.influenceTotal || 0) + 1;
              player.buckets[0] += 1;
            }
          }

          result.player_1.influenceTotal = result.player_1.influenceTotal || 0;
          result.player_2.influenceTotal = result.player_2.influenceTotal || 0;
          result.unclaimedTotal = result.unclaimedTotal || 0;

          logger.log(
            "[UI] Territory own stones excluded:",
            excludedOwnStones,
          );

          return result;
        }

        adjustConfidenceForScoreLead(result, scoreLead) {
          // Calculate current confidence difference (black - white)
          const confidenceDiff = result.player_1.total - result.player_2.total;

          // Score lead > 0 means Black is ahead, < 0 means White is ahead
          const scoreLeadDiff = scoreLead;

          // Calculate the adjustment needed to match score lead
          const adjustment = scoreLeadDiff - confidenceDiff;

          logger.log(
            `[UI] Score Lead Adjustment - Score Lead: ${
              scoreLead.toFixed(1)
            }, Confidence Diff: ${confidenceDiff.toFixed(1)}, Adjustment: ${
              adjustment.toFixed(1)
            }`,
          );

          if (Math.abs(adjustment) > 0.1) { // Only adjust if meaningful difference
            if (adjustment > 0) {
              // Need to add points to Black (or remove from White)
              const pointsToAdd = adjustment;

              // Add to Black's highest confidence bucket (90-100%)
              result.player_1.buckets[10] += pointsToAdd;
              result.player_1.total += pointsToAdd;

              logger.log(
                `[UI] Added ${
                  pointsToAdd.toFixed(1)
                } points to Black to match score lead`,
              );
            } else {
              // Need to add points to White (or remove from Black)
              const pointsToAdd = Math.abs(adjustment);

              // Add to White's highest confidence bucket (90-100%)
              result.player_2.buckets[10] += pointsToAdd;
              result.player_2.total += pointsToAdd;

              logger.log(
                `[UI] Added ${
                  pointsToAdd.toFixed(1)
                } points to White to match score lead`,
              );
            }

            // Round adjusted totals
            result.player_1.total = +result.player_1.total.toFixed(3);
            result.player_2.total = +result.player_2.total.toFixed(3);
          }
        }

        updateScoreBar(ownershipData) {
          // Update the confidence chart with ownership data
          if (this.scoreBarRenderer) {
            this.scoreBarRenderer.updateScoreBar(ownershipData);
          }
        }
      }

      // Initialize UI when page loads
      document.addEventListener("DOMContentLoaded", () => {
        window.uiManager = new UIManager();
        logger.log("[UI] UIManager initialized and ready to receive updates");
      });

      // Cleanup when page is unloaded
      window.addEventListener("beforeunload", () => {
        if (window.uiManager) {
          window.uiManager.stopReviewCountdown();
        }
      });

      // Global helper function to check if game is finished (for external analysis systems)
      window.isGameFinished = () => {
        return window.uiManager ? window.uiManager.gameFinished : false;
      };

      // Current played-move error/index color calculation.
      // Separate from backend move-quality counter buckets.
      function getMoveQualityColor(scoreLoss) {
        if (scoreLoss < 1) return "#4CB2E5"; // Blue: <1pp WR loss
        if (scoreLoss < 3) return "#1D9500"; // Green: 1-3pp WR loss
        if (scoreLoss < 6) return "#CECE00"; // Yellow: 3-6pp WR loss
        if (scoreLoss < 12) return "#CC0000"; // Red: 6-12pp WR loss
        return "#90216B"; // Purple: ≥12pp WR loss
      }
    </script>
  </body>
</html>
